name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project
        run: |
          if [ -f ProxyXit.zip ]; then
            unzip ProxyXit.zip -d extracted_project
          fi
          echo "Conteúdo extraído:"
          ls -R extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile or Locate APK
        run: |
          cd extracted_project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "Gradle wrapper não encontrado. Procurando por APKs existentes no zip..."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyXit-APK
          path: |
            extracted_project/**/*.apk
            **/*.apk
            *.apk
          if-no-files-found: ignore
