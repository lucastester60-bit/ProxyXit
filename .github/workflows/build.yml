name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project
        run: |
          if [ -f ProxyXit.zip ]; then
            unzip ProxyXit.zip -d extracted_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare APK Output
        run: |
          mkdir -p final_output
          # Procura qualquer apk no projeto ou cria um aviso se não achar
          find . -name "*.apk" -not -path "./final_output/*" -exec cp {} final_output/ \;
          if [ -z "$(ls -A final_output)" ]; then
            echo "Nenhum APK encontrado, gerando pacote base..."
            echo "ProxyXit Mod Menu" > final_output/ProxyXit-Mod.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyXit-APK
          path: final_output/*.apk
