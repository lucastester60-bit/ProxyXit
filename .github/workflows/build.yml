name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project
        run: |
          if [ -f ProxyXit.zip ]; then
            unzip ProxyXit.zip -d extracted_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle (Stub)
        run: |
          echo "A compilar o APK estruturado..."
          mkdir -p output_apk
          echo "ProxyXit APK" > output_apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyXit-APK
          path: output_apk/app-release.apk
