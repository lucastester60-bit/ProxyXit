name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Create Real Android Project Structure
        run: |
          mkdir -p myapp/app/src/main/java/com/proxyxit/app
          mkdir -p myapp/app/src/main/res/layout
          mkdir -p myapp/app/src/main/res/values

          # Descompacta o teu zip para uma pasta temporária
          mkdir -p temp_extracted
          if [ -f ProxyXit.zip ]; then
            unzip ProxyXit.zip -d temp_extracted
          fi

          # Move os teus ficheiros para o local correto do projeto Android
          find temp_extracted -name "*.kt" -exec cp {} myapp/app/src/main/java/com/proxyxit/app/ \;
          if [ -f temp_extracted/AndroidManifest.xml ]; then
            cp temp_extracted/AndroidManifest.xml myapp/app/src/main/res/
          else
            echo '<manifest package="com.proxyxit.app"></manifest>' > myapp/app/src/main/res/AndroidManifest.xml
          fi

          # Cria o build.gradle básico para forçar a compilação
          cat << 'EOF' > myapp/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > myapp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.proxyxit.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.proxyxit.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > myapp/settings.gradle
          rootProject.name = "ProxyXit"
          include ':app'
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd myapp
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyXit-APK
          path: myapp/app/build/outputs/apk/debug/app-debug.apk
