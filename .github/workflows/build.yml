name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project
        run: |
          if [ -f ProxyXit.zip ]; then
            unzip ProxyXit.zip -d extracted_project
          fi
          echo "--- ESTRUTURA DAS PASTAS ---"
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          cd extracted_project
          # Procura qualquer pasta que tenha o gradlew e compila nela
          find . -name "gradlew" -execdir chmod +x {} \; -execdir ./gradlew assembleRelease \;

      - name: Collect APKs
        run: |
          mkdir -p final_output
          find extracted_project -name "*.apk" -exec cp {} final_output/ \;
          ls -la final_output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyXit-APK
          path: final_output/*.apk
